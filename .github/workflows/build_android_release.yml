name: Build Android Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Target Flavor (dev = staging mal3abk-staging.runasp.net, prod = production mal3abk.runasp.net)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev
      build_number:
        description: 'Build Number (leave empty for automatic github.run_number)'
        required: false
        default: ''

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Release (AAB & APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Target Flavor
        id: determine_flavor
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FLAVOR="${{ github.event.inputs.flavor }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            FLAVOR="prod"
          else
            FLAVOR="dev"
          fi
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
          if [ "$FLAVOR" = "prod" ]; then
            echo "backend_url=http://mal3abk.runasp.net" >> $GITHUB_OUTPUT
            echo "env_label=Production" >> $GITHUB_OUTPUT
          else
            echo "backend_url=http://mal3abk-staging.runasp.net" >> $GITHUB_OUTPUT
            echo "env_label=Staging / Dev" >> $GITHUB_OUTPUT
          fi
          echo "Selected Flavor: $FLAVOR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Configure Keystore (if secrets provided)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. A debug-signed release build will be produced."
          fi

      - name: Configure Google Maps API Key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || '' }}
        run: |
          echo "MAPS_API_KEY=$MAPS_API_KEY" >> android/local.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB) & APK
        id: build_android
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUM="${{ github.event.inputs.build_number }}"
          else
            BUILD_NUM=$((1 + ${{ github.run_number }}))
          fi
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          FLAVOR="${{ steps.determine_flavor.outputs.flavor }}"
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT

          echo "Building AAB & APK for flavor: $FLAVOR (build $BUILD_NUM)"
          flutter build appbundle --release --flavor "$FLAVOR" -t "lib/main_${FLAVOR}.dart" \
            --build-number="$BUILD_NUM" \
            --obfuscate --split-debug-info=build/symbols

          flutter build apk --release --flavor "$FLAVOR" -t "lib/main_${FLAVOR}.dart" \
            --build-number="$BUILD_NUM" \
            --obfuscate --split-debug-info=build/symbols

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mal3abk-${{ steps.build_android.outputs.flavor }}-v${{ steps.build_android.outputs.build_num }}-aab
          path: build/app/outputs/bundle/*Release/*.aab
          retention-days: 30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mal3abk-${{ steps.build_android.outputs.flavor }}-v${{ steps.build_android.outputs.build_num }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: mal3abk-${{ steps.build_android.outputs.flavor }}-v${{ steps.build_android.outputs.build_num }}-symbols
          path: build/symbols
          retention-days: 90

      - name: Notify Slack of Android Build
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITOR_WEBHOOK }}
          FLAVOR: ${{ steps.build_android.outputs.flavor || steps.determine_flavor.outputs.flavor }}
          ENV_LABEL: ${{ steps.determine_flavor.outputs.env_label }}
          BACKEND_URL: ${{ steps.determine_flavor.outputs.backend_url }}
          BUILD_NUM: ${{ steps.build_android.outputs.build_num || 'N/A' }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          slack_url = os.environ.get("SLACK_WEBHOOK_URL", "").strip()
          if not slack_url:
              print("No SLACK_WEBHOOK_URL configured, skipping notification.")
              exit(0)

          flavor = os.environ.get("FLAVOR", "prod")
          env_label = os.environ.get("ENV_LABEL", "Production")
          backend_url = os.environ.get("BACKEND_URL", "http://mal3abk.runasp.net")
          build_num = os.environ.get("BUILD_NUM", "N/A")
          status = os.environ.get("JOB_STATUS", "unknown")
          commit_msg = os.environ.get("COMMIT_MSG", "").split("\n")[0]
          actor = os.environ.get("ACTOR", "")
          branch = os.environ.get("REF_NAME", "")
          run_url = os.environ.get("RUN_URL", "")

          is_success = (status.lower() == "success")
          emoji = "📱" if is_success else "❌"
          color = "#16a34a" if is_success else "#dc2626"
          title = f"{emoji} Android Build: {status.upper()} [{flavor.upper()}]"

          payload = {
              "text": f"{title} (Build #{build_num})",
              "attachments": [{
                  "color": color,
                  "blocks": [
                      {
                          "type": "header",
                          "text": {"type": "plain_text", "text": title, "emoji": True}
                      },
                      {
                          "type": "section",
                          "fields": [
                              {"type": "mrkdwn", "text": f"*Flavor:*\n`{flavor}` ({env_label})"},
                              {"type": "mrkdwn", "text": f"*Build Number:*\n`#{build_num}`"},
                              {"type": "mrkdwn", "text": f"*Branch / Trigger:*\n`{branch}` by `{actor}`"},
                              {"type": "mrkdwn", "text": f"*Target Backend:*\n<{backend_url}|{backend_url}>"}
                          ]
                      },
                      {
                          "type": "section",
                          "text": {"type": "mrkdwn", "text": f"*Commit:*\n>{commit_msg}"}
                      },
                      {
                          "type": "context",
                          "elements": [{"type": "mrkdwn", "text": f"<{run_url}|Download APK / AAB Artifacts in Actions>"}]
                      }
                  ]
              }]
          }

          try:
              req = urllib.request.Request(slack_url, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Slack notification sent: {resp.status}")
          except Exception as e:
              print(f"Failed to post to Slack: {e}")
          EOF
