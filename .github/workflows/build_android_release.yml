name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Target Flavor (dev = staging site109978, prod = production mal3abk)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev
      build_number:
        description: 'Build Number (leave empty for automatic github.run_number)'
        required: false
        default: ''

jobs:
  build-android:
    name: Build Android Release (AAB & APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Configure Keystore (if secrets provided)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
            storePassword=$KEYSTORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=upload-keystore.jks
            EOF
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. A debug-signed release build will be produced."
          fi

      - name: Configure Google Maps API Key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || '' }}
        run: |
          echo "MAPS_API_KEY=$MAPS_API_KEY" >> android/local.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB) & APK
        id: build_android
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUM="${{ github.event.inputs.build_number }}"
          else
            BUILD_NUM=$((1 + ${{ github.run_number }}))
          fi
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          FLAVOR="${{ github.event.inputs.flavor || 'prod' }}"
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT

          flutter build appbundle --release --flavor "$FLAVOR" -t "lib/main_${FLAVOR}.dart" \
            --build-number="$BUILD_NUM" \
            --obfuscate --split-debug-info=build/symbols

          flutter build apk --release --flavor "$FLAVOR" -t "lib/main_${FLAVOR}.dart" \
            --build-number="$BUILD_NUM" \
            --obfuscate --split-debug-info=build/symbols

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mal3abk-${{ steps.build_android.outputs.flavor }}-v${{ steps.build_android.outputs.build_num }}-aab
          path: build/app/outputs/bundle/*Release/*.aab
          retention-days: 30

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mal3abk-${{ steps.build_android.outputs.flavor }}-v${{ steps.build_android.outputs.build_num }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: mal3abk-prod-v${{ steps.build_android.outputs.build_num }}-symbols
          path: build/symbols
          retention-days: 90
