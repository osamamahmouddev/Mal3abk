name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Flavor / Backend (dev = staging mal3abk-staging.runasp.net, prod = production mal3abk.runasp.net)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      build_number:
        description: 'Build Number (leave empty for automatic github.run_number)'
        required: false
        default: ''

concurrency:
  group: deploy-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-testflight:
    name: Build & Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Install Apple Certificates & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t agg -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          PP_UUID=$(python3 -c "import plistlib, re; f=open('$PP_PATH', 'rb').read(); m=re.search(rb'<\?xml.*?</plist>', f, re.DOTALL); print(plistlib.loads(m.group(0))['UUID'])")
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PP_UUID}.mobileprovision

      # Without the key the iOS map renders blank: AppDelegate only starts
      # Google Maps when MAPS_API_KEY is in the Info.plist, and the key file is
      # not in git (see docs/backend-integration.md).
      - name: Create iOS Google Maps key file
        env:
          MAPS_API_KEY_IOS: ${{ secrets.MAPS_API_KEY_IOS || secrets.MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY_IOS || '' }}
        run: |
          if [ -z "$MAPS_API_KEY_IOS" ]; then
            echo "::warning::MAPS_API_KEY_IOS secret is not set. Google Maps will be blank on iOS until the secret is added."
          fi
          mkdir -p ios/Flutter
          printf 'MAPS_API_KEY = %s\n' "$MAPS_API_KEY_IOS" > ios/Flutter/Secrets.xcconfig

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod repo update

      - name: Build IPA for App Store / TestFlight
        id: build_ipa
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUM="${{ github.event.inputs.build_number }}"
          else
            PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | sed -n 's/.*+\([0-9]*\)/\1/p')
            BUILD_NUM="${PUBSPEC_BUILD:-14}"
          fi
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          TARGET_FLAVOR="${{ github.event.inputs.target || 'dev' }}"
          echo "target_flavor=$TARGET_FLAVOR" >> $GITHUB_OUTPUT
          ENTRYPOINT="lib/main_${TARGET_FLAVOR}.dart"
          echo "Building TestFlight IPA targeting: $ENTRYPOINT"
          flutter build ipa --release -t "$ENTRYPOINT" --build-number="$BUILD_NUM" --export-options-plist=ios/ExportOptions.plist --obfuscate --split-debug-info=build/symbols

      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"

          xcrun altool --upload-app -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mal3abk-build-${{ steps.build_ipa.outputs.build_num }}-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7

      # Needed to read crash stack traces of this obfuscated build.
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: mal3abk-build-${{ steps.build_ipa.outputs.build_num }}-symbols
          path: build/symbols
          retention-days: 90

      - name: Notify Slack of TestFlight Upload
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITOR_WEBHOOK }}
          TARGET_FLAVOR: ${{ steps.build_ipa.outputs.target_flavor || github.event.inputs.target || 'dev' }}
          BUILD_NUM: ${{ steps.build_ipa.outputs.build_num || 'N/A' }}
          JOB_STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          slack_url = os.environ.get("SLACK_WEBHOOK_URL", "").strip()
          if not slack_url:
              exit(0)

          target = os.environ.get("TARGET_FLAVOR", "dev")
          build_num = os.environ.get("BUILD_NUM", "N/A")
          status = os.environ.get("JOB_STATUS", "unknown")
          actor = os.environ.get("ACTOR", "")
          run_url = os.environ.get("RUN_URL", "")

          backend_url = "http://mal3abk.runasp.net" if target == "prod" else "http://mal3abk-staging.runasp.net"
          is_success = (status.lower() == "success")
          emoji = "✈️" if is_success else "❌"
          color = "#16a34a" if is_success else "#dc2626"
          title = f"{emoji} TestFlight Deploy: {status.upper()} [{target.upper()}]"

          payload = {
              "text": f"{title} (Build #{build_num})",
              "attachments": [{
                  "color": color,
                  "blocks": [
                      {
                          "type": "header",
                          "text": {"type": "plain_text", "text": title, "emoji": True}
                      },
                      {
                          "type": "section",
                          "fields": [
                              {"type": "mrkdwn", "text": f"*Target Flavor:*\n`{target}`"},
                              {"type": "mrkdwn", "text": f"*Build Number:*\n`#{build_num}`"},
                              {"type": "mrkdwn", "text": f"*Uploaded By:*\n`{actor}`"},
                              {"type": "mrkdwn", "text": f"*Backend:*\n<{backend_url}|{backend_url}>"}
                          ]
                      },
                      {
                          "type": "context",
                          "elements": [{"type": "mrkdwn", "text": f"<{run_url}|View TestFlight GitHub Run>"}]
                      }
                  ]
              }]
          }

          try:
              req = urllib.request.Request(slack_url, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Slack notification sent: {resp.status}")
          except Exception as e:
              print(f"Failed to post to Slack: {e}")
          EOF
