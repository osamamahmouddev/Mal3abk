name: Flutter CI Quality Gate

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Flutter Analyze & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Core & Feature Unit Tests
        run: flutter test test/core test/features

      - name: Notify Slack on CI Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITOR_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          slack_url = os.environ.get("SLACK_WEBHOOK_URL", "").strip()
          if not slack_url:
              exit(0)

          branch = os.environ.get("REF_NAME", "dev")
          commit_msg = os.environ.get("COMMIT_MSG", "").split("\n")[0]
          actor = os.environ.get("ACTOR", "")
          run_url = os.environ.get("RUN_URL", "")

          payload = {
              "text": f"❌ Mobile CI Quality Gate Failed [{branch}]",
              "attachments": [{
                  "color": "#dc2626",
                  "blocks": [
                      {
                          "type": "header",
                          "text": {"type": "plain_text", "text": "❌ Mobile CI Quality Gate: FAILED", "emoji": True}
                      },
                      {
                          "type": "section",
                          "fields": [
                              {"type": "mrkdwn", "text": f"*Branch:*\n`{branch}`"},
                              {"type": "mrkdwn", "text": f"*Triggered By:*\n`{actor}`"},
                              {"type": "mrkdwn", "text": f"*Event:*\n`{os.environ.get('GITHUB_EVENT_NAME', 'push')}`"}
                          ]
                      },
                      {
                          "type": "section",
                          "text": {"type": "mrkdwn", "text": f"*Commit:*\n>{commit_msg}"}
                      },
                      {
                          "type": "context",
                          "elements": [{"type": "mrkdwn", "text": f"<{run_url}|View CI Failure Logs>"}]
                      }
                  ]
              }]
          }

          try:
              req = urllib.request.Request(slack_url, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Slack failure notification status: {resp.status}")
          except Exception as e:
              print(f"Failed to post to Slack: {e}")
          EOF
