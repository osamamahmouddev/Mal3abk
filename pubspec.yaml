name: mal3abk
description: "Mal3abk - Sports field booking and management application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # API & Networking
  dio: ^5.9.2
  retrofit: ^4.9.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # State Management
  flutter_bloc: ^9.1.1

  # Dependency Injection
  get_it: ^9.2.1

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.2.0

  # UI / Responsive / Sizing
  flutter_screenutil_plus: ^1.4.0
  easy_localization: ^3.0.8
  intl: ^0.20.2
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  flutter_native_splash: 2.4.7
  flutter_hooks: ^0.21.3+1
  shimmer: ^3.0.0
  local_auth: ^3.0.2
  image: ^4.12.0
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.2
  add_2_calendar: ^3.0.1
  timezone: ^0.11.2
  google_maps_flutter: ^2.18.1
  geolocator: ^14.1.2
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

  # Code generation
  retrofit_generator: ^10.2.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  build_runner: ^2.15.0

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  objective_c: 9.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/pngs/
    - assets/images/svgs/
    - assets/translations/

  fonts:
    - family: Fustat
      fonts:
        - asset: assets/Fonts/Fustat/Fustat-ExtraLight.ttf
          weight: 200
        - asset: assets/Fonts/Fustat/Fustat-Light.ttf
          weight: 300
        - asset: assets/Fonts/Fustat/Fustat-Regular.ttf
          weight: 400
        - asset: assets/Fonts/Fustat/Fustat-Medium.ttf
          weight: 500
        - asset: assets/Fonts/Fustat/Fustat-SemiBold.ttf
          weight: 600
        - asset: assets/Fonts/Fustat/Fustat-Bold.ttf
          weight: 700
        - asset: assets/Fonts/Fustat/Fustat-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/Fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/Fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200
        - asset: assets/Fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/Fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/Fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/Fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/Fonts/IBM_Plex_Sans_Arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/pngs/icon-app-1024.png"
  background_color_ios: "#071832"
  # Android adaptive icon (Android 8+)
  adaptive_icon_background: "#071832"
  adaptive_icon_foreground: "assets/images/pngs/icon-mark-1024.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/pngs/icon-app-1024.png"
    background_color: "#071832"
    theme_color: "#071832"

flutter_native_splash:
  color: "#071832"
  image: assets/images/pngs/splash-logo.png
  # Android 12+ crops the splash image to a circle, so it keeps the pin alone.
  android_12:
    image: assets/images/pngs/splash-mark.png
    color: "#071832"
  android: true
  ios: true
  web: false
